name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"


      - name: Pasang dependensi dan siapkan aset web
        run: |
          npm install
          npm run build

      - name: Buat proyek Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Bangun APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60
